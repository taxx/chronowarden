# ChronoWarden front door.
#
# Serves the Flutter web build and proxies the API under the same origin so the
# client needs neither CORS nor an absolute API URL. The API keeps its
# /api/v1 prefix (no trailing slash on proxy_pass), so both sides agree.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # API: streaming, buffering off so SSE (/api/v1/events) flows immediately.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Flutter web app.
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
