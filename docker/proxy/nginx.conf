# ChronoWarden front door.
#
# Serves the React build and proxies the API under the same origin so the
# client needs neither CORS nor an absolute API URL. The API keeps its
# /api/v1 prefix (no trailing slash on proxy_pass), so both sides agree.
#
# Rate-limit zones live at the http level (this file is included from http).
# `$binary_remote_addr` is the direct peer — behind the host reverse proxy that
# is one address, so these are coarse global backstops; the API's own limiter
# (per account / forwarded client) is the fine-grained layer.
limit_req_zone $binary_remote_addr zone=cw_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=cw_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    server_tokens off;

    # Security headers for every response (TLS is terminated by the host proxy,
    # so HSTS still reaches the browser).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API: streaming, buffering off so SSE (/api/v1/events) flows immediately.
    location /api/ {
        limit_req zone=cw_api burst=120 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Authentication endpoints get a stricter bucket.
    location /api/v1/auth/ {
        limit_req zone=cw_auth burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/invites/validate {
        limit_req zone=cw_auth burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React app. The CSP is deliberately strict: the DEK is cached in
    # localStorage, so any script injection would be a full data compromise.
    # NOTE: a location-level add_header disables inheritance, so repeat the
    # server-level security headers here.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
